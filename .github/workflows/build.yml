name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm install
      - run: npx vitest run
      - run: node scripts/build.js
      - run: node scripts/verify-build.js

      - name: Check configurator.html is up to date
        run: |
          if ! git diff --quiet configurator.html; then
            echo "::error::configurator.html is stale. Run 'npm run build' and commit the result."
            git diff --stat configurator.html
            exit 1
          fi
