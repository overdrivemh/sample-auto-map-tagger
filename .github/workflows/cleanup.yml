        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_LINKED5_ACCOUNT_ID }}:role/GitHubActionsE2ERole
          aws-region: ap-northeast-2
          unset-current-credentials: true

      - name: Verify AWS identity — linked account 5
        env:
